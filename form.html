<form name="clientes" method="POST" data-netlify="true" action="/gracias.html">

    <input type="hidden" name="form-name" value="clientes">

    <label>Nombre</label>
    <input type="text" name="nombre" required>

    <label>Correo</label>
    <input type="email" name="correo" required>

    <label>Mensaje</label>
    <textarea name="mensaje" required></textarea>

    <button type="submit">Enviar</button>

</form>
