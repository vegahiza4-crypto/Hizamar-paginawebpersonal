<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca Tiza</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f4f4;
}

/* HEADER */
header{
    background:#2c3e50;
    color:white;
    padding:20px;
}

.contenedor-logo{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    margin-bottom:20px;
}

.logo{
    width:120px;
    height:120px;
    object-fit:contain;
    background:white;
    padding:5px;
    border-radius:10px;
}

.eslogan{
    color:#ddd;
    font-style:italic;
}

/* BOTONES INFO */
.botones-info{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
    margin:20px 0;
}

.botones-info button{
    padding:12px 25px;
    border:none;
    background:#f1c40f;
    color:#2c3e50;
    font-weight:bold;
    border-radius:8px;
    cursor:pointer;
    transition:.3s;
}

.botones-info button:hover{
    background:#f39c12;
}

.info-contenido{
    background:white;
    color:#333;
    max-width:900px;
    margin:auto;
    padding:20px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
}

/* CARRUSEL */
.carrusel-principal{
    position:relative;
    width:90%;
    max-width:900px;
    height:450px;
    margin:30px auto;
    overflow:hidden;
    border-radius:15px;
}

.imagen-slide{
    position:absolute;
    width:100%;
    height:100%;
    opacity:0;
    transition:1s;
}

.imagen-slide img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.imagen-slide.activo{
    opacity:1;
}

.indicadores{
    position:absolute;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
}

.dot{
    width:12px;
    height:12px;
    background:white;
    border-radius:50%;
    display:inline-block;
    margin:4px;
}

.dot.activo{
    background:#f1c40f;
}

/* MENU */
.menu{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
    padding:25px;
}

.menu button{
    padding:12px 20px;
    border:none;
    background:#2c3e50;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

/* CONTENIDO */
#contenido{
    width:85%;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

/* TABLA */
.tabla-libros{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

.tabla-libros th{
    background:#2c3e50;
    color:white;
    padding:12px;
}

.tabla-libros td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

.tabla-libros tr:nth-child(even){
    background:#f2f2f2;
}

/* IMAGEN LIBRO */
.img-libro{
    width:60px;
    height:85px;
    object-fit:cover;
    cursor:pointer;
    border-radius:6px;
    transition:0.3s;
}

.img-libro:hover{
    transform:scale(1.1);
}

/* MODAL IMAGEN */
#modal-img{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.85);
    justify-content:center;
    align-items:center;
    z-index:99999;
}

#modal-img img{
    max-width:80%;
    max-height:80%;
    border-radius:10px;
    box-shadow:0 0 20px black;
    cursor:pointer;
}

/* BUSQUEDA */
.busqueda{
    text-align:center;
    margin-top:20px;
}

.busqueda input{
    width:300px;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

.busqueda button{
    padding:10px 15px;
    border:none;
    background:#2c3e50;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

.busqueda button:hover{
    background:#34495e;
}

/* FOOTER */
footer{
    background:#2c3e50;
    color:white;
    text-align:center;
    padding:30px;
    margin-top:40px;
}

.redes a{
    color:white;
    font-size:35px;
    margin:0 15px;
}

.redes a:hover{
    color:#f1c40f;
}

</style>
</head>

<body>

<header>

<div class="contenedor-logo">
<img src="logo.jpg" class="logo">

<div>
<h1>BIBLIOTECA TIZA</h1>
<p class="eslogan">"Las letras a tus ojos"</p>
</div>

</div>

<!-- INFO BOTONES -->
<div class="botones-info">

<button onclick="mostrarInfo('mision')">Misión</button>
<button onclick="mostrarInfo('vision')">Visión</button>
<button onclick="mostrarInfo('somos')">¿Quiénes Somos?</button>

</div>

<div class="info-contenido" id="info">
Haz clic en los botones para ver información.
</div>



<!-- CARRUSEL -->
<div class="carrusel-principal">

<div class="imagen-slide activo">
<img src="https://images.unsplash.com/photo-1521587760476-6c12a4b040da">
</div>

<div class="imagen-slide">
<img src="https://images.unsplash.com/photo-1507842217343-583bb7270b66">
</div>

<div class="imagen-slide">
<img src="https://www.educaciontrespuntocero.com/wp-content/uploads/2023/02/Biblioteca-del-Trinity-Collage.jpg">
</div>

<div class="indicadores">
<span class="dot activo"></span>
<span class="dot"></span>
<span class="dot"></span>
</div>

</div>

</header>

<!-- MENU COMPLETO (DEL SEGUNDO CÓDIGO) -->
<nav class="menu">

<button onclick="mostrar('categorias')">Categorías</button>
<button onclick="mostrar('linea')">Biblioteca en Línea</button>
<button onclick="mostrar('consulta')">Consulta</button>
<button onclick="mostrar('informacion')">Información</button>
<button onclick="mostrar('ubicacion')">Ubicación</button>

</nav>

<section id="contenido">

<h2>Bienvenido a Biblioteca Tiza</h2>
<p>Selecciona una opción del menú para explorar nuestros recursos.</p>

</section>

<footer>

<h3>Síguenos en redes sociales</h3>

<div class="redes">

<a href="https://www.instagram.com/biblioteca_tiza?igsh=aHJyaDhscmgxaG4z"><i class="fab fa-instagram"></i></a>
<a href="https://www.facebook.com/share/1J7erDksC9/"><i class="fab fa-facebook"></i></a>
<a href="https://wa.me/qr/RNEEQBECV477J1"><i class="fab fa-whatsapp"></i></a>

</div>

</footer>

<!-- MODAL -->
<div id="modal-img" onclick="cerrarModal()">
    <img id="img-grande">
</div>

<script>

/* INFO (MISIÓN / VISIÓN / QUIÉNES SOMOS) */
function mostrarInfo(tipo){

const info = document.getElementById("info");

if(tipo=="mision"){
info.innerHTML="<h2>Misión</h2><p>Misión</h2><p>Promover la lectura, la educación y el acceso al conocimiento mediante recursos físicos y digitales para toda la comunidad..</p>";
}
else if(tipo=="vision"){
info.innerHTML="<h2>Visión</h2><p>Ser una biblioteca que ofrezca acceso a la información, el aprendizaje y la cultura.</p>";
}
else if(tipo=="somos"){
info.innerHTML="<h2>¿Quiénes Somos?</h2><p>Somos una biblioteca comprometida con la educación, la investigación y el desarrollo académico de nuestros usuarios.</p>";
}

}

/* MODAL IMAGEN (DEL PRIMER CÓDIGO) */
function abrirImagen(img){
document.getElementById("modal-img").style.display="flex";
document.getElementById("img-grande").src = img.src;
}

function cerrarModal(){
document.getElementById("modal-img").style.display="none";
}

/* MENÚ COMPLETO (DEL SEGUNDO CÓDIGO) */
function mostrar(opcion){

const c = document.getElementById("contenido");

if(opcion==="categorias"){

c.innerHTML=`

<h2>Categorías de Libros</h2>

<table class="tabla-libros">

<tr>
<th>Categoría</th>
<th>Libro</th>
<th>Autor</th>
<th>Imagen</th>
</tr>

<tr>
<td>Novela</td>
<td>Don Quijote</td>
<td>Miguel de Cervantes</td>
<td><img src="https://oceano.mx/img/obra/media/13684.jpg" class="img-libro" onclick="abrirImagen(this)"></td>
</tr>

<tr>
<td>Infantil</td>
<td>El Principito</td>
<td>Antoine de Saint-Exupéry</td>
<td><img src="https://cdn.kobo.com/book-images/1b34e68b-1e68-4927-936b-892adca9f261/1200/1200/False/el-principito-74.jpg" class="img-libro" onclick="abrirImagen(this)"></td>
</tr>

<tr>
<td>Literatura</td>
<td>Cien años de soledad</td>
<td>Gabriel García Márquez</td>
<td><img src="https://www.abacus.coop/dw/image/v2/BDLM_PRD/on/demandware.static/-/Sites-AbacusMaster/default/dwaee072c6/images/large/1520116.05.jpg?sw=740" class="img-libro" onclick="abrirImagen(this)"></td>
</tr>

<tr>
<td>Ciencia Ficción</td>
<td>1984</td>
<td>George Orwell</td>
<td><img src="https://cdn.kobo.com/book-images/c9472126-7f96-402d-ba57-5ba4c0f4b238/353/569/90/False/nineteen-eighty-four-1984-george.jpg" class="img-libro" onclick="abrirImagen(this)"></td>
</tr>

<tr>
<td>Fantasía</td>
<td>El Hobbit</td>
<td>J.R.R. Tolkien</td>
<td><img src="https://www.elsotano.com/sotano_covers/9786070/9786070724145%20.jpg" class="img-libro" onclick="abrirImagen(this)"></td>
</tr>

<tr>
<td>Terror</td>
<td>Drácula</td>
<td>Bram Stoker</td>
<td><img src="https://m.media-amazon.com/images/I/61MgodE1s0L._AC_UF1000,1000_QL80_.jpg" class="img-libro" onclick="abrirImagen(this)"></td>
</tr>

<tr>
<td>Romance</td>
<td>Orgullo y Prejuicio</td>
<td>Jane Austen</td>
<td><img src="https://m.media-amazon.com/images/I/71wnBzT9WqL._AC_UF1000,1000_QL80_.jpg" class="img-libro" onclick="abrirImagen(this)"></td>
</tr>

<tr>
<td>Misterio</td>
<td>Sherlock Holmes</td>
<td>Arthur Conan Doyle</td>
<td><img src="https://m.media-amazon.com/images/I/513VTCDLp9L._AC_UF1000,1000_QL80_.jpg" class="img-libro" onclick="abrirImagen(this)"></td>
</tr>

</table>

`;
}

else if(opcion==="linea"){
c.innerHTML=`
<h2>Biblioteca</h2>
<p><a href="https://share.google/5IjOCYxxODpxB7648" target="_blank">Libro digital</a></p>
`;
}

else if(opcion==="consulta"){
c.innerHTML=`
<h2>Consulta libros</h2>

<div class="busqueda">
<input type="text" id="busquedaLibro" placeholder="Escribe el  nombre del libro">
<button onclick="buscarLibro()">Buscar</button>
</div>
`;
}

else if(opcion==="informacion"){
c.innerHTML=`
<h2>Información</h2>

<h3>Horario</h3>
<p>Lunes a Viernes: 8:00 AM - 4:00 PM</p>

<br>

<h3>Servicios</h3>
<ul style="text-align:left; display:inline-block;">
<li>Préstamo de libros</li>
<li>Consulta en sala</li>
<li>Biblioteca digital</li>
<li>Apoyo a estudiantes</li>
</ul>

<hr style="margin:25px 0;">


`;
}



else if(opcion==="ubicacion"){
c.innerHTML=`
<h2>Ubicación</h2>
<iframe
src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1371.5131776747887!2d-99.58794363583965!3d20.00255450339079!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85d24b85f53ffc83%3A0x35eaeea6aca052a7!2sVilla%20Mantua!5e1!3m2!1ses-419!2smx!4v1781830561257!5m2!1ses-419!2smx"
width="100%" height="300" style="border:0;">
</iframe>
<p>La Comunidad Jilotepec</p>
`;
}

}

/* BUSCADOR (DEL SEGUNDO CÓDIGO) */
function buscarLibro(){

const libro = document.getElementById("busquedaLibro").value.toLowerCase().trim();

const libros = {

"don quijote":"https://share.google/5IjOCYxxODpxB7648",
"el principito":"https://share.google/5IjOCYxxODpxB7648",
"cien años de soledad":"https://share.google/5IjOCYxxODpxB7648"

};

if(libros[libro]){
window.open(libros[libro], "_blank");
}else{
alert("Libro no encontrado.");
}

}

/* CARRUSEL */
let actual = 0;

const slides = document.querySelectorAll(".imagen-slide");
const dots = document.querySelectorAll(".dot");

setInterval(()=>{

slides[actual].classList.remove("activo");
dots[actual].classList.remove("activo");

actual++;

if(actual >= slides.length){
actual = 0;
}

slides[actual].classList.add("activo");
dots[actual].classList.add("activo");

},3000);

</script>

</body>
</html>
